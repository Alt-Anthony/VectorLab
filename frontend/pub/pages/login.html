<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VectorLab</title>
    <link rel="stylesheet" href="../css/tema.css">
</head>

<body>
    <header class="navbar">
        <a class="marca" href="/">Vector<span>Lab</span></a>
        <nav>
            <a href="/">Inicio</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main class="contenedor-auth">
        <div class="card-auth">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <div class="grupo-campo">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" placeholder="usuario@correo.com" required>
                </div>
                <div class="grupo-campo">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="boton-submit">Ingresar</button>
            </form>
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </main>

    <script src="/frontend/pub/js/"></script>
</body>

</html>
